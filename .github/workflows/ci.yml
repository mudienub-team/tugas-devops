name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Test
        run: npm test

  e2e:
    name: E2E Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Production Build
    needs:
      - lint
      - unit-test
      - e2e

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # prepare deployment package
      - name: Prepare Artifact
        if: github.event_name == 'push'
        run: |
          mkdir -p deploy-package

          cp -a .next/standalone/. deploy-package/

          mkdir -p deploy-package/.next/static

          cp -a .next/static/. \
            deploy-package/.next/static/

          if [ -d public ]; then
            cp -a public deploy-package/
          fi

          cp ecosystem.config.cjs deploy-package/

      # upload artifact
      - name: Upload Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-production
          path: deploy-package/
          retention-days: 7

      # trigger jenkins
      - name: Trigger Jenkins CD
        if: github.event_name == 'push'
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}

        run: |
          curl -fsS -X POST \
            --user "$JENKINS_USER:$JENKINS_API_TOKEN" \
            --data-urlencode "RUN_ID=$GITHUB_RUN_ID" \
            --data-urlencode "COMMIT_SHA=$GITHUB_SHA" \
            "$JENKINS_URL/job/tugas-devops/buildWithParameters"
