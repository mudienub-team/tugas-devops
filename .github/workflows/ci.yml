name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Test
        run: npm test

  build:
    name: Production Build
    needs:
      - lint
      - unit-test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        env:
          DATABASE_URL: "mysql://root:root@localhost:3306/todos_db"
        run: npm run build

  docker-build:
    name: Docker Build Test
    needs:
      - lint
      - unit-test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: tugas-devops:latest

  trigger-jenkins:
    name: Trigger Jenkins CD
    needs:
      - build
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Trigger Jenkins
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}

        run: |
          if [ -n "$JENKINS_URL" ] && [ -n "$JENKINS_USER" ] && [ -n "$JENKINS_API_TOKEN" ]; then
            curl -fsS -X POST \
              --user "$JENKINS_USER:$JENKINS_API_TOKEN" \
              --data-urlencode "RUN_ID=$GITHUB_RUN_ID" \
              --data-urlencode "COMMIT_SHA=$GITHUB_SHA" \
              "$JENKINS_URL/job/tugas-devops/buildWithParameters"
          else
            echo "Jenkins secrets are not configured, skipping webhook trigger."
          fi
